<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Pilotage">
  <!-- Un cadran avec son aiguille : l'instrument qu'on regarde pour savoir ou
       on en est. Lisible a 16 px parce qu'il ne repose que sur trois formes —
       un arc, une aiguille, un point. -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <path d="M26 66 a26 26 0 1 1 48 0" fill="none" stroke="#334155"
        stroke-width="7" stroke-linecap="round"/>
  <path d="M26 66 a26 26 0 0 1 14-23" fill="none" stroke="#3b82f6"
        stroke-width="7" stroke-linecap="round"/>
  <path d="M50 66 L64 40" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="66" r="6" fill="#e2e8f0"/>
</svg>
