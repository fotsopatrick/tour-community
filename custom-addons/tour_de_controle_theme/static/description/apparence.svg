<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Apparence">
  <!--
    Un disque coupé en deux : la moitié claire, la moitié sombre. C'est le
    pictogramme que tout le monde reconnaît pour « changer le fond », sur
    Android comme sur iOS — on ne cherche pas l'originalité sur une icône de
    réglage, on cherche à être compris sans légende.
  -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <path d="M50 24 a26 26 0 0 1 0 52 z" fill="#e2e8f0"/>
  <circle cx="50" cy="50" r="26" fill="none" stroke="#3b82f6" stroke-width="4"
          stroke-dasharray="6 8" opacity=".55"/>
</svg>
